name: orbit

services:
  orbit-redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: always
    networks:
      - orbit-network
    volumes:
      - orbit-redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  orbit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: orbit
    restart: always
    user: '1001:1001'

    stdin_open: true
    tty: true

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - TZ=America/Mexico_City
      - AUTH_MODE=${AUTH_MODE:-qr}
      - DOCKER_MODE=true
      - USE_REDIS=true
      - REDIS_HOST=orbit-redis
      - REDIS_PORT=6379
      - SESSION_PATH=/app/orbitsession
      - NODE_OPTIONS=--max-old-space-size=512

    depends_on:
      orbit-redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    networks:
      - orbit-network

    volumes:
      - orbit_session:/app/orbitsession
      - orbit_subbots:/app/data/subbot-sessions
      - orbit_database:/app/data
      - orbit_temp:/app/data/temp
      - ./panel:/app/panel:ro,Z

    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '10'

    stop_signal: SIGTERM
    stop_grace_period: 30s

networks:
  orbit-network:
    driver: bridge

volumes:
  orbit_session:
    name: orbit_session
    driver: local

  orbit_subbots:
    name: orbit_subbots
    driver: local

  orbit_database:
    name: orbit_database
    driver: local

  orbit_temp:
    name: orbit_temp
    driver: local

  orbit-redis-data:
    name: orbit-redis-data
    driver: local
